'').trim(),tipo:b.tipo||'Especialização',modalidade:b.modalidade||'Presencial',\n    cargaHoraria:parseInt(b.cargaHoraria,10)||0,duracao:b.duracao||'',valor:b.valor||'',inicio:b.inicio||'',descricao:b.descricao||'',publico:b.publico||'',destaque:!!b.destaque,ativo:b.ativo!==false}; }\n  window.fetch=function(url,o){\n    o=o||{}; var m=o.method||'GET', p=String(url).split('?')[0], b=o.body?JSON.parse(o.body):{}, r;\n    if(p==='/api/courses') return json(200,{courses:db.courses.filter(function(c){return c.ativo}),contact:db.contact});\n    if(p==='/api/admin/login'){ if(b.user==='admin'&&b.password==='preview'){logged=true;return json(200,{ok:true});} return json(401,{error:'Usuário ou senha inválidos. (preview: admin / preview)'}); }\n    if(p==='/api/admin/logout'){logged=false;return json(200,{ok:true});}\n    if(!logged) return json(401,{error:'Não autenticado'});\n    if(p==='/api/admin/me') return json(200,{user:'admin'});\n    if(p==='/api/admin/settings'){ if(m==='PUT'){db.contact=b.contact;save(db);} return json(200,{user:'admin',contact:db.contact}); }\n    if(p==='/api/admin/password') return json(200,{ok:true});\n    if(p==='/api/admin/courses'){\n      if(m==='GET') return json(200,{courses:db.courses});\n      var c=clean(b); if(c.nome.length<3||!c.area) return json(400,{error:'Informe nome (mín. 3) e área.'});\n      var id=slug(c.nome)||String(Date.now()); if(db.courses.some(function(x){return x.id===id})) id+='-'+Date.now()%1000;\n      c.id=id; db.courses.push(c); save(db); return json(201,c);\n    }\n    if(r=/^\\/api\\/admin\\/courses\\/([a-z0-9-]+)(\\/toggle)?$/.exec(p)){\n      var i=db.courses.findIndex(function(x){return x.id===r[1]}); if(i<0) return json(404,{error:'Curso não encontrado'});\n      if(r[2]){db.courses[i].ativo=!db.courses[i].ativo;}\n      else if(m==='PUT'){var n=clean(b); if(n.nome.length<3||!n.area) return json(400,{error:'Informe nome (mín. 3) e área.'}); db.courses[i]=Object.assign({},db.courses[i],n);}\n      else if(m==='DELETE'){db.courses.splice(i,1);save(db);return json(200,{ok:true});}\n      save(db); return json(200,db.courses[i]);\n    }\n    return json(404,{error:'Rota inexistente'});\n  };\n})();\n<\/script>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>Administração | Pós-Graduação Univiçosa</title>\n<style>:root{--azul:#0b2a5b;--azul2:#14428a;--dourado:#e0a526;--bg:#f4f6fb;--card:#fff;--txt:#1c2434;--mut:#637089;--bd:#dfe4ee;--ok:#1a8f4d;--err:#c0392b;--r:14px}\n*{box-sizing:border-box}\nbody{margin:0;font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}\na{color:var(--azul2)}\n.wrap{max-width:1120px;margin:0 auto;padding:0 16px}\nheader.top{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff}\nheader.top .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0}\nheader.top .brand{font-weight:800;letter-spacing:.3px;font-size:1.1rem}\nheader.top .brand span{color:var(--dourado)}\nheader.top nav a{color:#fff;opacity:.85;text-decoration:none;font-size:.9rem}\n.hero{padding:48px 0 64px}\n.hero h1{margin:0 0 10px;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.15}\n.hero p{margin:0;max-width:640px;opacity:.9;font-size:1.05rem}\n.filters{display:flex;gap:10px;flex-wrap:wrap;margin:-32px 0 24px;background:var(--card);padding:14px;border-radius:var(--r);box-shadow:0 6px 24px rgba(11,42,91,.12)}\n.filters input,.filters select{flex:1 1 180px}\ninput,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--txt);width:100%}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--azul2);outline-offset:1px}\nlabel{display:block;font-size:.82rem;font-weight:600;color:var(--mut);margin-bottom:4px}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:40px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;position:relative}\n.card.destaque{border-color:var(--dourado);box-shadow:0 0 0 2px rgba(224,165,38,.25)}\n.card h3{margin:0;font-size:1.1rem;color:var(--azul)}\n.card p{margin:0;color:var(--mut);font-size:.93rem}\n.tags{display:flex;gap:6px;flex-wrap:wrap}\n.tag{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#e8eefb;color:var(--azul2)}\n.tag.gold{background:#fdf1d4;color:#8a5e00}\n.tag.off{background:#f6dcd8;color:var(--err)}\n.tag.on{background:#d9f1e3;color:var(--ok)}\n.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.85rem;margin-top:auto}\n.meta b{display:block;font-size:.7rem;text-transform:uppercase;color:var(--mut);letter-spacing:.4px}\n.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--azul2);color:#fff;text-decoration:none;display:inline-block;text-align:center}\n.btn:hover{background:var(--azul)}\n.btn.gold{background:var(--dourado);color:#2b1d00}\n.btn.ghost{background:transparent;color:var(--azul2);border:1px solid var(--bd)}\n.btn.danger{background:var(--err)}\n.btn.sm{padding:6px 11px;font-size:.82rem}\n.empty{text-align:center;color:var(--mut);padding:50px 0}\nfooter{background:var(--azul);color:#cfd8ec;padding:28px 0;font-size:.9rem}\nfooter a{color:#fff}\n/* admin */\n.login{max-width:380px;margin:12vh auto;background:var(--card);padding:28px;border-radius:var(--r);border:1px solid var(--bd);display:grid;gap:14px}\n.login h1{margin:0;color:var(--azul);font-size:1.3rem}\n.err{color:var(--err);font-size:.88rem;min-height:1.2em}\n.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}\n.toolbar .grow{flex:1 1 200px}\ntable{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd)}\nth,td{padding:11px 12px;text-align:left;font-size:.9rem;border-bottom:1px solid var(--bd);vertical-align:middle}\nth{background:#eef2fa;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}\ntr.inactive td{opacity:.6}\ntd.actions .btn{margin:2px 4px 2px 0}\n.tablewrap{overflow-x:auto}\n.tabs{display:flex;gap:6px;margin-top:18px}\n.tabs button{font:inherit;font-weight:600;border:0;background:transparent;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--mut)}\n.tabs button.active{background:var(--card);color:var(--azul);border:1px solid var(--bd);border-bottom-color:var(--card)}\n.panel{background:var(--card);border:1px solid var(--bd);border-radius:0 var(--r) var(--r) var(--r);padding:18px}\ndialog{border:0;border-radius:var(--r);padding:0;width:min(680px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}\ndialog::backdrop{background:rgba(11,42,91,.55)}\ndialog form{padding:22px;display:grid;gap:12px}\ndialog h2{margin:0;color:var(--azul)}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.check{display:flex;gap:18px;align-items:center}\n.check label{display:flex;align-items:center;gap:6px;margin:0;font-size:.9rem;color:var(--txt)}\n.check input{width:auto}\n.stats{display:flex;gap:12px;flex-wrap:wrap}\n.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 18px}\n.stat b{font-size:1.5rem;color:var(--azul);display:block}\n.toast{position:fixed;bottom:20px;right:20px;background:var(--azul);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}\n.toast.show{opacity:1}\n@media(max-width:640px){.row,.row3{grid-template-columns:1fr}}\n</style>\n</head>\n<body>\n<!-- Login -->\n<form id=\"login\" class=\"login\" hidden>\n  <h1>Área administrativa</h1>\n  <div><label for=\"lu\">Usuário</label><input id=\"lu\" autocomplete=\"username\" required></div>\n  <div><label for=\"lp\">Senha</label><input id=\"lp\" type=\"password\" autocomplete=\"current-password\" required></div>\n  <div class=\"err\" id=\"lerr\" role=\"alert\"></div>\n  <button class=\"btn\">Entrar</button>\n  <a href=\"/\">← Voltar ao site</a>\n</form>\n\n<!-- Painel -->\n<div id=\"app\" hidden>\n  <header class=\"top\"><div class=\"wrap\"><div class=\"bar\">\n    <div class=\"brand\">UNIVIÇOSA <span>Admin Pós-Graduação</span></div>\n    <nav><a href=\"/\" target=\"_blank\">Ver site</a> · <a href=\"#\" id=\"logout\">Sair</a></nav>\n  </div></div></header>\n  <main class=\"wrap\">\n    <div class=\"tabs\"><button data-tab=\"cursos\" class=\"active\">Cursos</button><button data-tab=\"config\">Configurações</button></div>\n    <section class=\"panel\" id=\"tab-cursos\">\n      <div class=\"stats\" id=\"stats\"></div>\n      <div class=\"toolbar\">\n        <input class=\"grow\" id=\"aq\" type=\"search\" placeholder=\"Buscar por nome ou área…\">\n        <select id=\"as\" style=\"width:auto\"><option value=\"\">Todos</option><option value=\"1\">Ativos</option><option value=\"0\">Inativos</option></select>\n        <button class=\"btn gold\" id=\"newBtn\">+ Novo curso</button>\n      </div>\n      <div class=\"tablewrap\"><table>\n        <thead><tr><th>Curso</th><th>Área</th><th>Tipo / Modalidade</th><th>Status</th><th>Ações</th></tr></thead>\n        <tbody id=\"rows\"></tbody>\n      </table></div>\n    </section>\n    <section class=\"panel\" id=\"tab-config\" hidden>\n      <h2>Contato exibido no site</h2>\n      <form id=\"contactForm\" class=\"row3\">\n        <div><label>WhatsApp (DDI+DDD+número)</label><input id=\"cw\" placeholder=\"5532999999999\"></div>\n        <div><label>E-mail</label><input id=\"ce\" type=\"email\"></div>\n        <div><label>Telefone</label><input id=\"cp\"></div>\n        <div><button class=\"btn\">Salvar contato</button></div>\n      </form>\n      <h2 style=\"margin-top:28px\">Alterar senha</h2>\n      <form id=\"pwForm\" class=\"row3\">\n        <div><label>Senha atual</label><input id=\"pc\" type=\"password\" autocomplete=\"current-password\" required></div>\n        <div><label>Nova senha (mín. 8)</label><input id=\"pn\" type=\"password\" autocomplete=\"new-password\" minlength=\"8\" required></div>\n        <div><button class=\"btn\">Alterar senha</button></div>\n      </form>\n    </section>\n  </main>\n</div>\n\n<!-- Modal curso -->\n<dialog id=\"dlg\">\n  <form id=\"form\" method=\"dialog\">\n    <h2 id=\"dlgTitle\">Novo curso</h2>\n    <div><label>Nome do curso *</label><input name=\"nome\" required minlength=\"3\" maxlength=\"140\"></div>\n    <div class=\"row3\">\n      <div><label>Área *</label><input name=\"area\" required list=\"areas\" maxlength=\"80\"><datalist id=\"areas\"></datalist></div>\n      <div><label>Tipo</label><select name=\"tipo\"><option>Especialização</option><option>MBA</option><option>Residência</option><option>Extensão</option></select></div>\n      <div><label>Modalidade</label><select name=\"modalidade\"><option>Presencial</option><option>Semipresencial</option><option>EAD</option></select></div>\n    </div>\n    <div class=\"row3\">\n      <div><label>Carga horária (h)</label><input name=\"cargaHoraria\" type=\"number\" min=\"0\"></div>\n      <div><label>Duração</label><input name=\"duracao\" placeholder=\"12 meses\"></div>\n      <div><label>Início</label><input name=\"inicio\" placeholder=\"Turma março/2027\"></div>\n    </div>\n    <div><label>Investimento</label><input name=\"valor\" placeholder=\"12x de R$ 0,00 ou 'Consulte condições'\"></div>\n    <div><label>Descrição</label><textarea name=\"descricao\" rows=\"3\" maxlength=\"1500\"></textarea></div>\n    <div><label>Público-alvo</label><input name=\"publico\" maxlength=\"400\"></div>\n    <div class=\"check\">\n      <label><input type=\"checkbox\" name=\"destaque\"> Destacar na vitrine</label>\n      <label><input type=\"checkbox\" name=\"ativo\" checked> Ativo (visível no site)</label>\n    </div>\n    <div class=\"err\" id=\"ferr\" role=\"alert\"></div>\n    <div style=\"display:flex;gap:10px;justify-content:flex-end\">\n      <button type=\"button\" class=\"btn ghost\" id=\"cancel\">Cancelar</button>\n      <button class=\"btn\" id=\"save\">Salvar</button>\n    </div>\n  </form>\n</dialog>\n<div class=\"toast\" id=\"toast\" role=\"status\"></div>\n\n<script>const $ = s => document.querySelector(s);\nconst el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };\nlet courses = [], editingId = null;\n\nasync function api(path, method = 'GET', body) {\n  const r = await fetch('/api/admin' + path, {\n    method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined,\n  });\n  const data = await r.json().catch(() => ({}));\n  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('Sessão expirada. Faça login novamente.'); }\n  if (!r.ok) throw new Error(data.error || 'Erro ' + r.status);\n  return data;\n}\nfunction toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }\nconst showLogin = () => { $('#app').hidden = true; $('#login').hidden = false; };\n\nasync function boot() {\n  try { await api('/me'); } catch { return showLogin(); }\n  $('#login').hidden = true; $('#app').hidden = false;\n  await Promise.all([loadCourses(), loadSettings()]);\n}\n\n$('#login').addEventListener('submit', async e => {\n  e.preventDefault(); $('#lerr').textContent = '';\n  try { await api('/login', 'POST', { user: $('#lu').value, password: $('#lp').value }); $('#lp').value = ''; boot(); }\n  catch (err) { $('#lerr').textContent = err.message; }\n});\n$('#logout').addEventListener('click', async e => { e.preventDefault(); await api('/logout', 'POST').catch(() => {}); showLogin(); });\n\ndocument.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {\n  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));\n  $('#tab-cursos').hidden = b.dataset.tab !== 'cursos'; $('#tab-config').hidden = b.dataset.tab !== 'config';\n}));\n\n/* ---- cursos ---- */\nasync function loadCourses() { courses = (await api('/courses')).courses; render(); }\n\nfunction render() {\n  const q = $('#aq').value.trim().toLowerCase(), s = $('#as').value;\n  const ativos = courses.filter(c => c.ativo).length;\n  $('#stats').replaceChildren(...[['Total', courses.length], ['Ativos', ativos], ['Inativos', courses.length - ativos]].map(([k, v]) => {\n    const d = el('div', 'stat'); d.append(el('b', '', v), document.createTextNode(k)); return d;\n  }));\n  $('#areas').replaceChildren(...[...new Set(courses.map(c => c.area))].map(a => { const o = el('option'); o.value = a; return o; }));\n  const list = courses.filter(c => (!s || String(+c.ativo) === s) && (!q || (c.nome + ' ' + c.area).toLowerCase().includes(q)))\n    .sort((a, b) => b.ativo - a.ativo || a.nome.localeCompare(b.nome, 'pt-BR'));\n  $('#rows').replaceChildren(...list.map(row));\n  if (!list.length) { const tr = el('tr'); const td = el('td', '', 'Nenhum curso encontrado.'); td.colSpan = 5; tr.append(td); $('#rows').append(tr); }\n}\n\nfunction row(c) {\n  const tr = el('tr', c.ativo ? '' : 'inactive');\n  const n = el('td'); const b = el('b', '', c.nome); n.append(b); if (c.destaque) n.append(' ', el('span', 'tag gold', '★'));\n  const st = el('td'); st.append(el('span', 'tag ' + (c.ativo ? 'on' : 'off'), c.ativo ? 'Ativo' : 'Inativo'));\n  const act = el('td', 'actions');\n  const mk = (txt, cls, fn) => { const x = el('button', 'btn sm ' + cls, txt); x.addEventListener('click', fn); return x; };\n  act.append(\n    mk('Editar', 'ghost', () => openForm(c)),\n    mk(c.ativo ? 'Desativar' : 'Ativar', 'ghost', async () => {\n      try { await api(`/courses/${c.id}/toggle`, 'POST'); toast(c.ativo ? 'Curso desativado' : 'Curso ativado'); loadCourses(); } catch (e) { toast(e.message); }\n    }),\n    mk('Excluir', 'danger', async () => {\n      if (!confirm(`Excluir definitivamente \"${c.nome}\"?\\n\\nDica: para apenas retirar do site, use \"Desativar\".`)) return;\n      try { await api(`/courses/${c.id}`, 'DELETE'); toast('Curso excluído'); loadCourses(); } catch (e) { toast(e.message); }\n    }));\n  const tm = el('td', '', `${c.tipo} · ${c.modalidade}`);\n  tr.append(n, el('td', '', c.area), tm, st, act);\n  return tr;\n}\n$('#aq').addEventListener('input', render); $('#as').addEventListener('input', render);\n\n/* ---- formulário ---- */\nconst form = $('#form');\nfunction openForm(c) {\n  editingId = c ? c.id : null;\n  $('#dlgTitle').textContent = c ? 'Editar curso' : 'Novo curso';\n  $('#ferr').textContent = '';\n  form.reset();\n  if (c) for (const [k, v] of Object.entries(c)) {\n    const f = form.elements[k]; if (!f) continue;\n    if (f.type === 'checkbox') f.checked = !!v; else f.value = v;\n  }\n  $('#dlg').showModal();\n}\n$('#newBtn').addEventListener('click', () => openForm(null));\n$('#cancel').addEventListener('click', () => $('#dlg').close());\nform.addEventListener('submit', async e => {\n  e.preventDefault();\n  const fd = new FormData(form);\n  const body = Object.fromEntries(fd.entries());\n  body.destaque = form.elements.destaque.checked; body.ativo = form.elements.ativo.checked;\n  try {\n    if (editingId) await api('/courses/' + editingId, 'PUT', body); else await api('/courses', 'POST', body);\n    $('#dlg').close(); toast('Curso salvo'); loadCourses();\n  } catch (err) { $('#ferr').textContent = err.message; }\n});\n\n/* ---- configurações ---- */\nasync function loadSettings() {\n  const s = await api('/settings');\n  $('#cw').value = s.contact.whatsapp || ''; $('#ce').value = s.contact.email || ''; $('#cp').value = s.contact.phone || '';\n}\n$('#contactForm').addEventListener('submit', async e => {\n  e.preventDefault();\n  try { await api('/settings', 'PUT', { contact: { whatsapp: $('#cw').value, email: $('#ce').value, phone: $('#cp').value } }); toast('Contato salvo'); } catch (err) { toast(err.message); }\n});\n$('#pwForm').addEventListener('submit', async e => {\n  e.preventDefault();\n  try { await api('/password', 'POST', { current: $('#pc').value, next: $('#pn').value }); e.target.reset(); toast('Senha alterada'); } catch (err) { toast(err.message); }\n});\n\nboot();\n<\/script>\n</body>\n</html>\n"};
